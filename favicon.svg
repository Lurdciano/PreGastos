<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.5" />
  
  <!-- Rising Coin with Currency Symbol -->
  <g filter="url(#glow)">
    <circle cx="27" cy="22" r="11" fill="url(#coinGrad)" stroke="#a7f3d0" stroke-width="1.2" />
    <circle cx="27" cy="22" r="8.5" fill="none" stroke="#047857" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.6" />
    <path d="M27 16v12M24.5 19.5c0-1.4 1.1-2.2 2.5-2.2 1.5 0 2.6.8 2.6 2 0 2.2-5.1 1.7-5.1 4.2 0 1.3 1.1 2.2 2.6 2.2 1.5 0 2.6-.9 2.6-2.2" 
          stroke="#064e3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkle Accent on top right -->
  <path d="M46 11l1.5 3.5L51 16l-3.5 1.5L46 21l-1.5-3.5L41 16l3.5-1.5L46 11z" fill="url(#goldGrad)" />

  <!-- Wallet Body -->
  <g filter="url(#glow)">
    <rect x="12" y="25" width="40" height="27" rx="6" fill="url(#emeraldGrad)" stroke="#6ee7b7" stroke-width="1.2" />
    <!-- Flap pocket -->
    <path d="M34 32h15a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H34a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4z" fill="#064e3b" stroke="#34d399" stroke-width="1" />
    <!-- Clasp dot -->
    <circle cx="37" cy="39" r="2.2" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="0.6" />
    <!-- Subtle stitch detail -->
    <path d="M16 29h32" stroke="#a7f3d0" stroke-width="0.8" stroke-dasharray="2 2" stroke-opacity="0.5" />
  </g>
</svg>
